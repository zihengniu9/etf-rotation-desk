name: Update industry mainline data

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_industry_data.py"
      - "web/industry_mainline_dashboard.html"
      - ".github/workflows/update-industry-data.yml"
      - "requirements.txt"
  schedule:
    # A-share trading hours in Asia/Hong_Kong: 09:30-11:30 and 13:00-15:00.
    - cron: "30 1 * * 1-5"
    - cron: "0,30 2-3 * * 1-5"
    - cron: "0,30 5-6 * * 1-5"
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: market-data-refresh
  cancel-in-progress: false

jobs:
  update-industry:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh industry mainline JSON and CSV
        run: |
          python scripts/update_industry_data.py --refresh \
            --output outputs/industry_flow.csv \
            --json-output outputs/industry_flow.json \
            --status-output outputs/industry_update_status.json

      - name: Verify industry outputs
        run: |
          node tests/web_dashboard.test.js
          node tests/web_style.test.js
          node tests/deploy_config.test.js
          test -s outputs/industry_flow.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("outputs/industry_flow.json").read_text(encoding="utf-8"))
          assert payload["rows"], "industry_flow.json has no rows"
          assert payload["data_as_of"], "industry_flow.json has no data date"
          print(f"industry_json_rows={len(payload['rows'])} data_as_of={payload['data_as_of']}")
          PY

      - name: Commit refreshed industry outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/industry_flow.csv outputs/industry_flow.json outputs/industry_update_status.json
          if git diff --cached --quiet; then
            echo "No industry output changes to commit."
          else
            git commit -m "Update industry mainline data"
            git push
          fi
